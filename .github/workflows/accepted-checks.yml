name: Accepted checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accepted-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-reference:
    name: Windows reference checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap, verify and exercise refusals
        shell: powershell
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .\scripts\ci.ps1

      - name: Retain check evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accepted-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tools/ci/*.json
            .tools/ci/*.log
            .tools/verification/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
